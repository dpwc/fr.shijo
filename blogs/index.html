    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --forest: #2F5C56;
            --forest-mid: #3D7A72;
            --forest-light: #4A8E85;
            --sage: #5BA4A4;
            --sage-light: #8CC4C4;
            --sage-pale: #D1ECEC;
            --sage-ghost: #E8F4F4;
            --gold: #C9944A;
            --gold-light: #E0BB80;
            --gold-pale: #F5E6CC;
            --rose: #C47A7A;
            --rose-pale: #F4E0E0;
            --rose-soft: #F9E8E8;
            --lavender: #8B7EB8;
            --lavender-pale: #E4DDF2;
            --lavender-soft: #F0EBF8;
            --sky: #6AA0D4;
            --sky-pale: #D6E6F5;
            --sky-soft: #EAF1FA;
            --peach: #E8B4A0;
            --peach-pale: #F8E8E0;
            --mint: #A8D8C8;
            --mint-pale: #E0F2EC;
            --cream: #FAF8F4;
            --cream-dark: #EDE8E0;
            --charcoal: #1A2E2C;
            --charcoal-soft: #3A5553;
            --muted: #6A8A88;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--charcoal);
            overflow-x: hidden;
            line-height: 1.65;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Playfair Display', serif;
        }

        .font-hand {
            font-family: 'Caveat', cursive;
        }

        ::selection {
            background: var(--sage-pale);
            color: var(--charcoal);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--cream);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--sage-light);
            border-radius: 3px;
        }

        /* ═══════════ LOADER ═══════════ */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .8s ease, visibility .8s;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--cream-dark);
            border-top-color: var(--forest);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-label {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: var(--forest);
            font-weight: 600;
            letter-spacing: .5px;
        }

        /* ═══════════ FALLING SHAPES ═══════════ */
        #fallingLeaves {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .fleaf {
            position: absolute;
            top: -6%;
            will-change: transform, opacity;
            animation: leafDrift linear infinite;
        }

        .fleaf svg {
            width: 100%;
            height: 100%;
        }

        @keyframes leafDrift {
            0% {
                transform: translateY(-4vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            4% {
                opacity: var(--la, .15);
            }

            25% {
                transform: translateY(25vh) translateX(var(--sw, 30px)) rotate(90deg);
            }

            50% {
                transform: translateY(50vh) translateX(calc(var(--sw, 30px)*-.55)) rotate(200deg);
            }

            75% {
                transform: translateY(75vh) translateX(calc(var(--sw, 30px)*.7)) rotate(300deg);
            }

            96% {
                opacity: var(--la, .15);
            }

            100% {
                transform: translateY(108vh) translateX(calc(var(--sw, 30px)*-.2)) rotate(400deg);
                opacity: 0;
            }
        }

        /* ═══════════ NAV ═══════════ */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 16px 28px;
            background: rgba(250, 248, 244, .85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: padding .4s, box-shadow .4s;
        }

        .nav.scrolled {
            background: rgba(250, 248, 244, .95);
            box-shadow: 0 1px 30px rgba(47, 92, 86, .06);
            padding: 10px 28px;
        }

        .nav-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: var(--forest);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .4s cubic-bezier(.4, 0, .2, 1);
        }

        .nav-logo:hover .nav-logo-icon {
            transform: rotate(-8deg) scale(1.05);
        }

        .nav-logo-icon svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--charcoal-soft);
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: .3px;
            transition: color .3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--sage);
            border-radius: 1px;
            transition: width .3s;
        }

        .nav-links a:hover {
            color: var(--forest);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a.active {
            color: var(--forest);
            font-weight: 600;
        }

        .nav-links a.active::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--forest) !important;
            color: white !important;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 13px !important;
            font-weight: 600 !important;
            transition: all .3s !important;
            box-shadow: 0 4px 18px rgba(47, 92, 86, .2);
        }

        .nav-cta:hover {
            background: var(--forest-mid) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(47, 92, 86, .3);
        }

        .nav-cta::after {
            display: none !important;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--charcoal);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            position: relative;
        }

        .mobile-toggle:hover {
            background: var(--sage-ghost);
        }

        .mobile-toggle .icon-menu,
        .mobile-toggle .icon-close {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .3s, transform .3s;
        }

        .mobile-toggle.active .icon-menu {
            opacity: 0;
            transform: rotate(90deg);
            pointer-events: none;
        }

        .mobile-toggle.active .icon-close {
            opacity: 1;
            transform: rotate(0);
        }

        .mobile-toggle:not(.active) .icon-close {
            opacity: 0;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .mobile-toggle:not(.active) .icon-menu {
            opacity: 1;
            transform: rotate(0);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(250, 248, 244, .97);
            backdrop-filter: blur(24px);
            z-index: 99;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s;
        }

        .mobile-menu.active {
            opacity: 1;
            pointer-events: all;
        }

        .mobile-menu a {
            text-decoration: none;
            color: var(--charcoal);
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 500;
            transition: color .3s;
        }

        .mobile-menu a:hover {
            color: var(--forest);
        }

        @media(max-width:768px) {
            .nav-links {
                display: none;
            }

            .mobile-toggle {
                display: flex;
            }

            .mobile-menu {
                display: flex;
            }
        }

        /* ═══════════ PAGE HERO ═══════════ */
        .page-hero {
            padding: 100px 32px 60px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .page-hero-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ph-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .25;
        }

        .ph-blob-1 {
            width: 500px;
            height: 500px;
            background: var(--sage-pale);
            top: -20%;
            right: -10%;
        }

        .ph-blob-2 {
            width: 400px;
            height: 400px;
            background: var(--gold-pale);
            bottom: -15%;
            left: -5%;
        }

        .ph-blob-3 {
            width: 280px;
            height: 280px;
            background: var(--lavender-pale);
            top: 30%;
            left: 20%;
        }

        .page-hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 0 auto;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--forest);
            margin-bottom: 16px;
        }

        .section-label::before,
        .section-label::after {
            content: '';
            width: 28px;
            height: 1.5px;
            background: var(--sage-light);
            border-radius: 1px;
        }

        .page-hero h1 {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -.5px;
            color: var(--charcoal);
            margin-bottom: 16px;
        }

        .page-hero h1 .hl {
            position: relative;
            display: inline-block;
        }

        .page-hero h1 .hl::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: -2px;
            right: -2px;
            height: 10px;
            background: var(--sage-pale);
            border-radius: 3px;
            z-index: -1;
            opacity: .5;
        }

        .page-hero-desc {
            font-size: 16px;
            color: var(--charcoal-soft);
            line-height: 1.75;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ═══════════ FEATURED BLOG ═══════════ */
        .featured-section {
            padding: 0 32px 40px;
            max-width: 1240px;
            margin: 0 auto;
        }

        .featured-card {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            cursor: pointer;
            min-height: 420px;
            display: flex;
            align-items: flex-end;
            transition: transform .5s cubic-bezier(.4, 0, .2, 1), box-shadow .5s;
        }

        .featured-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(47, 92, 86, .12);
        }

        .featured-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .featured-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(26, 46, 44, .05) 0%, rgba(26, 46, 44, .55) 70%, rgba(26, 46, 44, .82) 100%);
        }

        .featured-decor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .featured-decor-circle {
            position: absolute;
            border: 1.5px solid rgba(255, 255, 255, .08);
            border-radius: 50%;
        }

        .fdc-1 {
            width: 200px;
            height: 200px;
            top: -40px;
            right: -30px;
            animation: spinSlow 80s linear infinite;
        }

        .fdc-2 {
            width: 120px;
            height: 120px;
            top: 20px;
            right: 100px;
            animation: spinSlow 60s linear infinite reverse;
        }

        .fdc-3 {
            width: 80px;
            height: 80px;
            bottom: 80px;
            left: 40px;
            animation: spinSlow 50s linear infinite;
        }

        @keyframes spinSlow {
            to {
                transform: rotate(360deg);
            }
        }

        .featured-content {
            position: relative;
            z-index: 2;
            padding: 48px 44px;
            width: 100%;
            color: white;
        }

        .featured-badges {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .badge-featured {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(201, 148, 74, .9);
            color: white;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-featured svg {
            width: 12px;
            height: 12px;
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(8px);
            color: white;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
        }

        .featured-content h2 {
            font-size: clamp(22px, 3vw, 34px);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 14px;
            letter-spacing: -.3px;
        }

        .featured-content .feat-excerpt {
            font-size: 15.5px;
            line-height: 1.7;
            opacity: .85;
            max-width: 600px;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .featured-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .feat-author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(255, 255, 255, .3);
        }

        .feat-author-info {
            display: flex;
            flex-direction: column;
        }

        .feat-author-name {
            font-size: 14px;
            font-weight: 600;
        }

        .feat-author-role {
            font-size: 12px;
            opacity: .7;
        }

        .feat-date {
            font-size: 13px;
            opacity: .6;
            margin-left: auto;
        }

        @media(max-width:768px) {
            .featured-card {
                min-height: 360px;
            }

            .featured-content {
                padding: 32px 24px;
            }

            .featured-content h2 {
                font-size: 22px;
            }

            .feat-date {
                margin-left: 0;
                margin-top: 4px;
            }
        }

        /* ═══════════ TAG FILTER ═══════════ */
        .filter-section {
            padding: 0 32px 36px;
            max-width: 1240px;
            margin: 0 auto;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--cream-dark);
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-right: 6px;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1.5px solid var(--cream-dark);
            background: transparent;
            color: var(--charcoal-soft);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .3s;
        }

        .filter-btn:hover {
            border-color: var(--sage-light);
            color: var(--forest);
        }

        .filter-btn.active {
            background: var(--forest);
            color: white;
            border-color: var(--forest);
            box-shadow: 0 3px 12px rgba(47, 92, 86, .2);
        }

        /* ═══════════ BLOG GRID ═══════════ */
        .blog-grid-section {
            padding: 0 32px 80px;
            max-width: 1240px;
            margin: 0 auto;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .blog-card {
            background: white;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(47, 92, 86, .04);
            box-shadow: 0 2px 16px rgba(47, 92, 86, .03);
            transition: all .45s cubic-bezier(.4, 0, .2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .blog-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(47, 92, 86, .1);
            border-color: var(--sage-pale);
        }

        .card-accent {
            height: 4px;
            width: 100%;
            transition: height .4s;
        }

        .blog-card:hover .card-accent {
            height: 5px;
        }

        .card-body {
            padding: 28px 24px 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-tag {
            display: inline-flex;
            align-self: flex-start;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .5px;
            margin-bottom: 14px;
        }

        .card-body h3 {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--charcoal);
            margin-bottom: 12px;
            letter-spacing: -.2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color .3s;
        }

        .blog-card:hover .card-body h3 {
            color: var(--forest);
        }

        .card-excerpt {
            font-size: 14px;
            color: var(--charcoal-soft);
            line-height: 1.65;
            margin-bottom: 20px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 18px;
            border-top: 1px solid var(--cream-dark);
        }

        .card-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 12px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .card-author-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .card-author-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--charcoal);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-author-role {
            font-size: 11px;

            height: 16px;

        .back-to-top {

            bottom: 32px;
            right: 32px;
            z-index: 90;

            height: 20px;

</head>

            const pastelColors = [
                '#D1ECEC', '#F5E6CC', '#F4E0E0', '#E4DDF2', '#D6E6F5',
                '#F8E8E0', '#E0F2EC', '#F9E8E8', '#F0EBF8', '#EAF1FA',
                '#E8F4F4', '#C8E6D8', '#F2D9E0', '#D4CCE8', '#FCE4C8',
                '#B8DCE8', '#E8D4C8', '#D0E8D0'
            ];

            function rand(min, max) { return Math.random() * (max - min) + min; }
            function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

            const shapeSVGs = [
                // Circle
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="16" fill="' + c + '" /></svg>';
                },
                // Ring
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="15" fill="none" stroke="' + c + '" stroke-width="3" /></svg>';
                },
                // Rounded square
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="28" height="28" rx="6" fill="' + c + '" /></svg>';
                },
                // Diamond
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="20" height="20" rx="3" fill="' + c + '" transform="rotate(45 20 20)" /></svg>';
                },
                // Triangle
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><polygon points="20,4 36,34 4,34" fill="' + c + '" /></svg>';
                },
                // Leaf
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 4C12 8 6 16 8 28c2-2 6-6 12-6s10 4 12 6c2-12-4-20-12-24z" fill="' + c + '" /><line x1="20" y1="10" x2="20" y2="28" stroke="' + c + '" stroke-width="1.5" opacity="0.5" /></svg>';
                },
                // Small dot cluster
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="14" cy="14" r="5" fill="' + c + '" /><circle cx="26" cy="14" r="5" fill="' + c + '" opacity="0.7" /><circle cx="20" cy="26" r="5" fill="' + c + '" opacity="0.5" /></svg>';
                },
                // Plus/cross
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="6" width="8" height="28" rx="4" fill="' + c + '" /><rect x="6" y="16" width="28" height="8" rx="4" fill="' + c + '" /></svg>';
                },
                // Heart
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 34s-13-8.5-13-17a7 7 0 0113.5-2.5A7 7 0 0133 17c0 8.5-13 17-13 17z" fill="' + c + '" /></svg>';
                },
                // Hexagon
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="' + c + '" /></svg>';
                },
                // Star (4-point)
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 2L23 17L38 20L23 23L20 38L17 23L2 20L17 17Z" fill="' + c + '" /></svg>';
                },
                // Crescent/arc
                function (c) {
                    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M28 6A14 14 0 1012 34 10 10 0 0028 6z" fill="' + c + '" /></svg>';
                }
            ];

            for (let i = 0; i < SHAPE_COUNT; i++) {
                const el = document.createElement('div');
                el.classList.add('fleaf');

                const color = pick(pastelColors);
                const size = rand(14, 44);
                const left = rand(0, 100);
                const duration = rand(16, 42);
                const delay = rand(0, 35);
                const sway = rand(-80, 80);
                const opacity = rand(0.12, 0.32);
                const shapeFn = pick(shapeSVGs);

                el.style.cssText =
                    'left:' + left + '%;' +
                    'width:' + size + 'px;' +
                    'height:' + size + 'px;' +
                    'animation-duration:' + duration + 's;' +
                    'animation-delay:-' + delay + 's;' +
                    '--sw:' + sway + 'px;' +
                    '--la:' + opacity.toFixed(2) + ';';

                el.innerHTML = shapeFn(color);
                container.appendChild(el);
            }
        })();

        /* ═══════════ NAV SCROLL ═══════════ */
        const mainNav = document.getElementById('mainNav');
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', function () {
            if (window.scrollY > 40) {
                mainNav.classList.add('scrolled');
            } else {
                mainNav.classList.remove('scrolled');
            }
            if (window.scrollY > 500) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
        backToTop.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        /* ═══════════ MOBILE MENU ═══════════ */
        const mobileToggle = document.getElementById('mobileToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        mobileToggle.addEventListener('click', function () {
            mobileToggle.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
        });
        mobileMenu.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () {
                mobileToggle.classList.remove('active');
                mobileMenu.classList.remove('active');
                document.body.style.overflow = '';
            });
        });

        /* ═══════════ TOAST ═══════════ */
        const toastEl = document.getElementById('toast');
        let toastTimer;
        function showToast(msg, icon) {
            clearTimeout(toastTimer);
            toastEl.innerHTML = (icon || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>') + '<span>' + msg + '</span>';
            toastEl.classList.add('show');
            toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
        }

        /* ═══════════ TAG COLORS ═══════════ */
        const tagColors = {
            'Psychology': { bg: '#E8F4F4', text: '#2F5C56', accent: '#5BA4A4' },
            'Faith': { bg: '#F5E6CC', text: '#7A5C2E', accent: '#C9944A' },
            'Relationships': { bg: '#F4E0E0', text: '#8B4A4A', accent: '#C47A7A' },
            'Mental Health': { bg: '#E4DDF2', text: '#5A4E8B', accent: '#8B7EB8' },
            'Spirituality': { bg: '#F0EBF8', text: '#6A5EA0', accent: '#8B7EB8' },
            'Self-Care': { bg: '#D6E6F5', text: '#3A6A9A', accent: '#6AA0D4' },
            'Family': { bg: '#F8E8E0', text: '#8A5A3A', accent: '#E8B4A0' },
            'Growth': { bg: '#E0F2EC', text: '#3A7A5A', accent: '#A8D8C8' },
            'Counseling': { bg: '#EAF1FA', text: '#4A7AB0', accent: '#6AA0D4' },
            'Wellness': { bg: '#F9E8E8', text: '#9A5A5A', accent: '#C47A7A' }
        };
        function getTagColor(tag) {
            return tagColors[tag] || { bg: '#E8F4F4', text: '#2F5C56', accent: '#5BA4A4' };
        }

        /* ═══════════ FORMAT DATE ═══════════ */
        function fmtDate(d) {
            if (!d) return '';
            var dt = d.toDate ? d.toDate() : new Date(d);
            return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        /* ═══════════ STRIP HTML ═══════════ */
        function stripHTML(html) {
            var tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        /* ═══════════ GRADIENT FROM TAG ═══════════ */
        function tagGradient(tag) {
            var tc = getTagColor(tag);
            return 'linear-gradient(135deg, ' + tc.accent + ', ' + tc.text + ')';
        }

        /* ═══════════ RENDER FEATURED ═══════════ */
        function renderFeatured(post) {
            var sec = document.getElementById('featuredSection');
            var tc = getTagColor(post.tag || 'Psychology');
            var initials = (post.authorName || 'SA').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
            sec.innerHTML =
                '<div class="featured-card" data-id="' + post.id + '">' +
                '<div class="featured-bg" style="background:' + tagGradient(post.tag || 'Psychology') + '"></div>' +
                '<div class="featured-decor">' +
                '<div class="featured-decor-circle fdc-1"></div>' +
                '<div class="featured-decor-circle fdc-2"></div>' +
                '<div class="featured-decor-circle fdc-3"></div>' +
                '</div>' +
                '<div class="featured-content">' +
                '<div class="featured-badges">' +
                '<span class="badge-featured"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01z"/></svg> Featured</span>' +
                '<span class="badge-tag">' + (post.tag || 'Psychology') + '</span>' +
                '</div>' +
                '<h2>' + (post.title || 'Untitled') + '</h2>' +
                '<p class="feat-excerpt">' + stripHTML(post.content || '') + '</p>' +
                '<div class="featured-meta">' +
                '<div class="feat-author-avatar">' + initials + '</div>' +
                '<div class="feat-author-info">' +
                '<div class="feat-author-name">' + (post.authorName || 'Fr. Dr. Shijo Antony CM') + '</div>' +
                '<div class="feat-author-role">' + (post.authorRole || 'Psychologist & Priest') + '</div>' +
                '</div>' +
                '<span class="feat-date">' + fmtDate(post.createdAt) + '</span>' +
                '</div>' +
                '</div>' +
                '</div>';
            sec.style.display = '';
            sec.querySelector('.featured-card').addEventListener('click', function () {
                openModal(post);
            });
        }

        /* ═══════════ RENDER GRID ═══════════ */
        function renderGrid(posts) {
            var grid = document.getElementById('blogGrid');
            grid.innerHTML = '';
            if (!posts.length) {
                grid.innerHTML =
                    '<div class="empty-state" style="grid-column:1/-1">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>' +
                    '<h3>No articles found</h3>' +
                    '<p>Try a different category or check back soon.</p>' +
                    '</div>';
                return;
            }
            posts.forEach(function (post) {
                var tc = getTagColor(post.tag || 'Psychology');
                var initials = (post.authorName || 'SA').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
                var card = document.createElement('div');
                card.className = 'blog-card';
                card.setAttribute('data-id', post.id);
                card.innerHTML =
                    '<div class="card-accent" style="background:' + tc.accent + '"></div>' +
                    '<div class="card-body">' +
                    '<span class="card-tag" style="background:' + tc.bg + ';color:' + tc.text + '">' + (post.tag || 'Psychology') + '</span>' +
                    '<h3>' + (post.title || 'Untitled') + '</h3>' +
                    '<p class="card-excerpt">' + stripHTML(post.content || '') + '</p>' +
                    '<div class="card-footer">' +
                    '<div class="card-avatar" style="background:' + tc.accent + '">' + initials + '</div>' +
                    '<div class="card-author-info">' +
                    '<div class="card-author-name">' + (post.authorName || 'Fr. Dr. Shijo Antony CM') + '</div>' +
                    '<div class="card-author-role">' + (post.authorRole || 'Psychologist & Priest') + '</div>' +
                    '</div>' +
                    '<span class="card-date">' + fmtDate(post.createdAt) + '</span>' +
                    '</div>' +
                    '</div>';
                card.addEventListener('click', function () { openModal(post); });
                grid.appendChild(card);
            });
        }

        /* ═══════════ RENDER FILTERS ═══════════ */
        function renderFilters(tags) {
            var bar = document.getElementById('filterBar');
            var sec = document.getElementById('filterSection');
            bar.innerHTML = '<span class="filter-label">Filter</span>';
            var allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'All';
            allBtn.setAttribute('data-tag', 'All');
            bar.appendChild(allBtn);
            tags.forEach(function (t) {
                var btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = t;
                btn.setAttribute('data-tag', t);
                bar.appendChild(btn);
            });
            sec.style.display = '';
            bar.querySelectorAll('.filter-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    bar.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    filterPosts(btn.getAttribute('data-tag'));
                });
            });
        }

        /* ═══════════ FILTER LOGIC ═══════════ */
        var allPosts = [];
        function filterPosts(tag) {
            if (tag === 'All') {
                renderGrid(allPosts);
            } else {
                renderGrid(allPosts.filter(function (p) { return p.tag === tag; }));
            }
        }

        /* ═══════════ MODAL ═══════════ */
        var modalOverlay = document.getElementById('blogModal');
        var modalCloseBtn = document.getElementById('modalCloseBtn');

        function openModal(post) {
            var tc = getTagColor(post.tag || 'Psychology');
            var initials = (post.authorName || 'SA').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
            document.getElementById('modalHeaderBg').style.background = tagGradient(post.tag || 'Psychology');
            document.getElementById('modalTitle').textContent = post.title || 'Untitled';
            document.getElementById('modalAvatar').textContent = initials;
            document.getElementById('modalAuthor').textContent = post.authorName || 'Fr. Dr. Shijo Antony CM';
            document.getElementById('modalRole').textContent = post.authorRole || 'Psychologist & Priest';
            document.getElementById('modalDate').textContent = fmtDate(post.createdAt);
            document.getElementById('modalTag').textContent = post.tag || 'Psychology';
            document.getElementById('modalTag').style.background = 'rgba(255,255,255,0.15)';
            document.getElementById('modalTag').style.color = 'white';
            document.getElementById('modalContent').innerHTML = post.content || '<p>No content available.</p>';
            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function (e) {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });

        /* ═══════════ SHARE ═══════════ */
        document.getElementById('shareCopy').addEventListener('click', function () {
            navigator.clipboard.writeText(window.location.href).then(function () {
                showToast('Link copied to clipboard!');
                document.getElementById('shareCopy').classList.add('copied');
                setTimeout(function () { document.getElementById('shareCopy').classList.remove('copied'); }, 2000);
            });
        });
        document.getElementById('shareWhatsApp').addEventListener('click', function () {
            window.open('https://wa.me/?text=' + encodeURIComponent(window.location.href), '_blank');
        });
        document.getElementById('shareEmail').addEventListener('click', function () {
            window.open('mailto:?subject=' + encodeURIComponent(document.getElementById('modalTitle').textContent) + '&body=' + encodeURIComponent(window.location.href), '_self');
        });

        /* ═══════════ LOAD BLOGS FROM FIRESTORE ═══════════ */
        db.collection('blogs').orderBy('createdAt', 'desc').get().then(function (snap) {
            var posts = [];
            snap.forEach(function (doc) {
                var d = doc.data();
                d.id = doc.id;
                posts.push(d);
            });
            allPosts = posts;

            // Featured: first post
            if (posts.length > 0) {
                renderFeatured(posts[0]);
                renderGrid(posts.slice(1));
            } else {
                document.getElementById('blogGridSection').querySelector('.blog-grid').innerHTML =
                    '<div class="empty-state" style="grid-column:1/-1">' +
                    '<h3>No articles yet</h3>' +
                    '<p>Check back soon for new reflections.</p>' +
                    '</div>';
            }

            // Tags
            var tagSet = {};
            posts.forEach(function (p) { if (p.tag) tagSet[p.tag] = true; });
            renderFilters(Object.keys(tagSet));

            // Hide loader
            setTimeout(function () {
                document.getElementById('loader').classList.add('hidden');
            }, 400);
        }).catch(function (err) {
            console.error('Error loading blogs:', err);
            document.getElementById('blogGrid').innerHTML =
                '<div class="empty-state" style="grid-column:1/-1">' +
                '<h3>Unable to load articles</h3>' +
                '<p>Please check your connection and try again.</p>' +
                '</div>';
            setTimeout(function () {
                document.getElementById('loader').classList.add('hidden');
            }, 400);
        });
    </script>
</body>

</html>
